<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Z-Image-人像专区</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(120deg, #00c6ff 0%, #0072ff 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #334155;
            padding-bottom: 40px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.6);
        }

        /* 灵感画廊样式 (美化版) */
        .gallery-section {
            margin-top: 20px;
        }

        .masonry-container {
            column-count: 3;
            column-gap: 20px;
            transition: opacity 0.3s ease;
        }

        .insp-card {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            break-inside: avoid;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid rgba(255,255,255,0.8);
            transition: all 0.3s ease;
            position: relative;
            backdrop-filter: blur(10px);
        }

        .insp-card:hover {
            transform: translateY(-3px);
            background: #fff;
            box-shadow: 0 12px 25px rgba(0,0,0,0.1);
            border-color: #818cf8;
        }

        .insp-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .insp-tag {
            font-size: 11px;
            color: #64748b;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .insp-editor {
            width: 100%;
            min-height: 40px;
            font-size: 13px;
            line-height: 1.6;
            color: #334155;
            background: transparent;
            border: 1px dashed transparent;
            border-radius: 6px;
            padding: 4px;
            white-space: pre-wrap;
            transition: all 0.2s;
            cursor: text;
            outline: none;
        }

        .insp-card:hover .insp-editor {
            border-color: rgba(99, 102, 241, 0.2);
        }
        
        .insp-editor:focus {
            background: #f8fafc;
            border-color: #6366f1;
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.1);
        }

        .btn-copy-mini {
            background: transparent;
            color: #6366f1;
            padding: 4px 10px;
            border: 1px solid #6366f1;
            font-size: 11px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-copy-mini:hover {
            background: #6366f1;
            color: #fff;
        }

        /* 响应式瀑布流 */
        @media (max-width: 900px) { .masonry-container { column-count: 2; } }
        @media (max-width: 600px) { .masonry-container { column-count: 1; } }

        /* Toast 提示 */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(15, 23, 42, 0.95);
            color: white;
            padding: 10px 24px;
            border-radius: 50px;
            font-size: 14px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
            z-index: 2000;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .toast.show { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body class="p-3 md:p-6">

    <div class="max-w-[1400px] mx-auto">
        
        <!-- Header -->
        <header class="card p-4 md:p-5 mb-5 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="text-center md:text-left shrink-0">
                <h1 class="text-2xl md:text-3xl font-extrabold text-[#2c3e50] tracking-tight">
                    Z Image <span class="text-indigo-600">人像专区</span>
                </h1>
                <p class="text-slate-500 text-xs md:text-sm mt-0.5">Z-Image-人像专区</p>
            </div>

            <div class="flex gap-2 w-full md:w-auto justify-center shrink-0">
                <button onclick="renderInspirationBatch()" class="flex-1 md:flex-none bg-white hover:bg-slate-50 text-indigo-600 border border-slate-200 px-5 py-2.5 rounded-xl font-bold transition shadow-sm active:scale-95 text-sm flex items-center justify-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>

                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>

            </div>
        </header>

        <!-- 灵感画廊区域 -->
        <div class="gallery-section">
            <div id="inspirationContainer" class="masonry-container">

            </div>
        </div>
    </div>

    <!-- Toast 提示框 -->
    <div id="toast" class="toast">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        <span id="toast-text">已复制</span>

<script id="raw-prompts" type="text/plain">
画面风格：日系清新春日樱花摄影，高分辨率极致画质，漫射光自然柔和，整体氛围粉嫩浪漫，充满初恋感。核心元素：年轻的东亚女性，身着米白色针织开衫内搭碎花连衣裙，在盛开的樱花树下露出洁白牙齿的甜美笑容，背景是粉白色的樱花雨与草地，人物位于画面中心，采用中景构图。具体内容：女性角色拥有栗色的微卷长发，发丝在微风中轻轻飘动，面部妆容清透，睫毛纤长，眼神温柔。她双手轻轻捧着一枝樱花，微微低头，露出一排整齐洁白的牙齿，笑容甜美治愈，充满少女的羞涩与喜悦。服装质感柔软，裙摆随风摇曳。背景中的樱花花瓣纷纷扬扬落下，草地生机勃勃，营造出春日午后的惬意氛围。构图方式：三分法构图，人物位于画面左侧三分之一处，右侧预留虚化的樱花背景空间。相机参数设定为全画幅传感器，使用 85mm 定焦镜头，光圈 f/1.8，快门速度 1/250 秒，ISO 100，白平衡偏暖调，对焦模式为眼部追踪对焦，确保眼神光与笑容细节清晰。光线来自顶部的柔和自然光，形成蝴蝶光效果，牙齿洁白自然，面部阴影柔和，整体色彩以粉色、米白、嫩绿为主，表现春天的生机。

画面风格：清新夏日向日葵田园人像，高清晰度胶片质感，色彩浓郁明亮，光影对比强烈，整体氛围热情洋溢，充满元气。核心元素：留着黑色波波头的年轻亚洲女性，穿着黄色吊带背心和牛仔短裤，在向日葵花田中开怀大笑，背景是金黄色的花海与蔚蓝天空，画面充满夏日的张力。具体内容：女性短发清爽利落，皮肤呈现健康的小麦色，五官立体，笑得眼睛弯成了月牙，嘴巴张大露出牙齿，笑容极具感染力。她一只手遮挡阳光眺望远方，姿态舒展，表现出无拘无束的快乐。服装色彩鲜明，与背景的向日葵相呼应。背景是高饱和度的向日葵花田，阳光强烈，云朵层次丰富。构图方式：低角度仰拍，人物位于画面中心，透视感强烈，突出人物的昂扬姿态。相机参数设定为全画幅传感器，使用 35mm 广角镜头，光圈 f/8.0，快门速度 1/1000 秒，ISO 200，确保远景蓝天清晰。光线来自正午的顶光，利用反光板补光，使人物面部及牙齿明亮无阴影，整体色调以明黄色和天蓝色为主，营造夏日艳阳下的活力感。

画面风格：秋日暖阳森林人像摄影，高分辨率细腻画质，侧逆光温润醇厚，整体氛围宁静致远，温柔治愈。核心元素：长发披肩的年轻东亚女性，身着焦糖色风衣，围着格子围巾，在铺满落叶的林间小道上露出温暖的笑，背景是金黄的银杏树与斑驳树影。具体内容：女性长发微卷，妆容大气，眼神中透着暖意，嘴角上扬露出整齐的牙齿，笑容亲切自然。她双手插在风衣口袋里，侧身回眸，姿态优雅放松。服装材质厚实有质感，围巾随意搭在肩头。背景光线透过树叶洒下光斑，落叶铺满地面，营造出深秋的浪漫诗意。构图方式：对角线构图，小路引导视线通向人物，人物位于画面黄金分割点。相机参数设定为全画幅传感器，使用 50mm 标准镜头，光圈 f/2.0，快门速度 1/200 秒，ISO 100，对焦锁定人物面部。光线来自侧后方的暖阳，勾勒出金色的轮廓光，照亮发丝和牙齿，画面色彩以焦糖色、金色为主，温暖人心。

画面风格：冬日初雪街头人像，高画质清透风格，阴天漫射光，整体氛围纯净唯美，梦幻灵动。核心元素：扎着高马尾的年轻亚洲女性，穿着米白色羽绒服搭配贝雷帽，在飘雪的街道上双手比耶，露出羞涩可爱的笑，背景是挂满彩灯的商店橱窗与积雪。具体内容：女性皮肤白皙红润，鼻头微冻，眼神清澈纯真，笑起来露出小虎牙，显得格外俏皮。她戴着毛绒手套，身体微微前倾，表现出对初雪的惊喜。服装蓬松温暖，贝雷帽增添了几分文艺气息。背景中的灯光朦胧柔和，雪花飞舞的轨迹清晰可见，营造出童话般的冬日场景。构图方式：中心构图，人物主体突出，背景虚化处理，突出飘雪的层次感。相机参数设定为全画幅传感器，使用 85mm 定焦镜头，光圈 f/1.8，快门速度 1/400 秒，ISO 400，白平衡自动。光线来自环境漫射光，整体亮度均匀，眼神光明亮，牙齿洁白，整体色调偏冷白，点缀温暖的橱窗灯光色。

画面风格：夕阳海岸度假人像，高清晰度摄影，逆光金黄质感，整体氛围慵懒浪漫，高级感十足。核心元素：拥有大波浪长发的年轻东亚女性，身着红色碎花吊带长裙，在海边沙滩上回眸大笑，背景是波光粼粼的大海与落日余晖。具体内容：女性发色为深棕色，发丝在逆光下呈现金边，面部轮廓立体，笑得爽朗大方，洁白的牙齿在夕照下闪着光泽。她赤脚踩在沙滩上，一手提裙摆，一手抚摸海风，姿态自由奔放。裙摆随风飘扬，展现曼妙身姿。背景海面金光闪闪，落日将天空染成橘红色，海浪层层叠叠。构图方式：剪影与半剪影结合，人物位于画面右侧，左侧留出大片海面空间。相机参数设定为全画幅传感器，使用 70-200mm 长焦镜头，光圈 f/2.8，快门速度 1/500 秒，ISO 100，评价测光。光线来自后方强烈的夕阳，形成强烈的轮廓光和发丝光，面部通过反光板补光保留细节，整体色调为橘红色与深蓝色对比。

画面风格：法式复古街头咖啡人像，高分辨率胶片风格，午后强光，色彩复古浓郁，整体氛围慵懒时尚。核心元素：留着法式刘海波浪卷的亚洲女性，穿着黑色方领连衣裙，在露天咖啡座前轻托着下巴，露出优雅的微笑，背景是欧式建筑与路人虚影。具体内容：女性红唇妆面精致，眼神迷离自信，笑容端庄大方，牙齿洁白。她桌上放着一杯冒热气的咖啡，姿态从容，仿佛在享受悠闲的下午茶时光。服装剪裁合体，举手投足间散发优雅气质。背景街道充满生活气息，斑驳的树影映在桌面上，光影交错，营造浓郁的法式风情。构图方式：平视视角，人物位于画面中心偏左，利用前景的咖啡杯增加层次。相机参数设定为全画幅传感器，使用 50mm 镜头，光圈 f/2.0，快门 1/250 秒，ISO 100，胶片色彩模拟。光线来自侧前方的直射阳光，形成明暗交界线，强化面部立体感，牙齿细节清晰，色调偏暖黄，怀旧感强烈。

画面风格：日系校园图书馆人像，高清晰度唯美感，室内柔光，整体氛围文艺清新，青春纯真。核心元素：戴着黑框眼镜的年轻亚洲女性，穿着整洁的白衬衫配灰色百褶裙，在书架间拿着书本，露出惊喜的笑，背景是高大的书架与窗纱。具体内容：女性黑长直发扎成马尾，脸上带着淡淡的雀斑，眼神聪明灵动，笑起来露出门牙，显得乖巧可爱。她单手抱着书本，身体微微前倾，像是发现了有趣的内容。衬衫领结系得端正，充满学院风气息。背景书架排列整齐，窗外透进来的光线营造出静谧的阅读氛围，尘埃在光束中飞舞。构图方式：框架式构图，利用书架作为前景框架，人物位于画面中心。相机参数设定为全画幅传感器，使用 85mm 镜头，光圈 f/2.2，快门 1/160 秒，ISO 400，单点对焦。光线来自侧后方的窗户光，照亮发丝和侧脸，眼神光温暖，整体色彩以白色、木色为主，干净清爽。

画面风格：清晨居家睡衣人像，高分辨率生活纪实，自然晨光，整体氛围亲近治愈，温馨舒适。核心元素：素颜的年轻东亚女性，穿着淡粉色纯棉睡衣，靠在卧室飘窗上，伸懒腰时露出慵懒的哈欠笑，背景是柔软的抱枕与清晨的城市远景。具体内容：女性头发随性地披散着，皮肤通透水润，眼神刚睡醒般迷蒙，嘴角上扬露出牙齿，展现出最真实的生活状态。睡衣材质舒适，身体姿态完全放松。背景飘窗上摆放着绿植和毛绒玩具，窗帘轻盈透光，窗外是宁静的城市晨景，阳光洒满房间。构图方式：中近景特写，注重人物表情捕捉，利用窗纱柔化背景。相机参数设定为全画幅传感器，使用 50mm 镜头，光圈 f/1.8，快门 1/125 秒，ISO 200，自然色彩。光线来自正面的柔和晨光，面部过渡平滑，呈现健康的肤色和洁白的牙齿，色调清新明亮。

<script>
    let INSPIRATION_DB = []; // 存储解析出的灵感数据

    function init() {
        parseRawPrompts();
        renderInspirationBatch();
    }

    // 解析 script 标签中的原始文本
    function parseRawPrompts() {
        const rawEl = document.getElementById('raw-prompts');
        if (!rawEl) return;
        
        const rawText = rawEl.innerText;
        // 以空行为切分标识
        INSPIRATION_DB = rawText.split(/\n\s*\n/)
            .map(t => t.trim())
            .filter(t => t.length > 0);
            
        console.log(`已成功加载 ${INSPIRATION_DB.length} 条人像提示词`);
    }

    // 随机打乱数组
    function shuffleArray(array) {
        const arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    // 渲染卡片
    function renderInspirationBatch() {
        const container = document.getElementById('inspirationContainer');
        container.style.opacity = '0'; // 切换时的淡出动效

        setTimeout(() => {
            container.innerHTML = '';
            const shuffled = shuffleArray(INSPIRATION_DB);
            const batch = shuffled.slice(0, 10); // 每次随机展示最多10个，可自行修改限制

            batch.forEach((text, index) => {
                const card = document.createElement('div');
                card.className = 'insp-card';
                card.innerHTML = `
                    <div class="insp-header">
                        <div class="insp-tag">
                            <span style="color:#6366f1">#</span> 灵感 ${index + 1}
                        </div>
                        <button class="btn-copy-mini" onclick="copyInspCard(this)">复制</button>
                    </div>
                    <div class="insp-editor" contenteditable="true" spellcheck="false">${text}</div>
                `;
                container.appendChild(card);
            });
            container.style.opacity = '1'; // 淡入
        }, 200);
    }

    // 复制单张卡片（提取实时修改后的 innerText）
    function copyInspCard(btn) {
        const cardBody = btn.parentElement.nextElementSibling;
        const text = cardBody.innerText;
        navigator.clipboard.writeText(text).then(() => {
            showToast('已复制');
            const originalText = btn.innerText;
            btn.innerText = 'OK';
            btn.style.background = '#6366f1';
            btn.style.color = '#fff';
            setTimeout(() => {
                btn.innerText = originalText;
                btn.style.background = '';
                btn.style.color = '';
            }, 1000);
        });
    }

    // 复制页面中所有的内容
    function copyAllInspiration() {
        const editors = document.querySelectorAll('.insp-editor');
        if (editors.length === 0) return;
        const allTexts = Array.from(editors).map(div => div.innerText).join('\n\n');
        navigator.clipboard.writeText(allTexts).then(() => {
            showToast(`已复制 ${editors.length} 条灵感`);
        });
    }

    // Toast 提示工具
    let toastTimer;
    function showToast(msg) {
        const toast = document.getElementById('toast');
        document.getElementById('toast-text').innerText = msg;
        toast.classList.add('show');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
    }

    // 启动初始化
    init();
</script>
